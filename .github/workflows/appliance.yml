# Builds and publishes the bintrail-appliance evaluation image (#350).
#
# Separate from the GoReleaser pipeline on purpose: the appliance image
# apt-installs MySQL + ProxySQL, and an appliance build failure must not
# block a bintrail release. Triggered by the v* tag push itself — NOT by
# `release: published`: GoReleaser creates the GitHub release with the
# default GITHUB_TOKEN, and events generated by that token never trigger
# other workflows (GitHub's anti-recursion guard), so a release-published
# trigger silently never fires. Verified the hard way on v0.8.0.
#
# Manual runs take an explicit existing tag (workflow_dispatch input) so
# a dispatch can never publish an unversioned branch build.
#
# NOTE: like ghcr.io/dbtrail/bintrail, the bintrail-appliance package is
# created PRIVATE on first push and needs a one-time manual flip to
# public before anonymous `docker run` works (see docs/docker.md).
name: appliance

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build (e.g. v0.8.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing via GitHub OIDC

jobs:
  build-push:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # On dispatch, build the tag's tree (checkout fails loudly if
          # the input names a tag that doesn't exist). On tag push this
          # is the pushed ref anyway.
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dbtrail/bintrail-appliance
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            # :latest stays off prereleases (tags containing '-', e.g.
            # v0.8.0-rc1), mirroring skip_push: auto on the main image's
            # manifest in .goreleaser.yaml.
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: appliance/Dockerfile
          # amd64-only: MySQL's apt repo ships no arm64 packages for
          # Debian. Apple Silicon evaluators run it via Rosetta/QEMU.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/dbtrail/bintrail-appliance@${DIGEST}"
