# Bintrail Docker Compose — the zero-friction quickstart.
#
#   1. cp .env.example .env       # set SOURCE_DSN to your MySQL
#   2. docker compose up -d
#   3. docker compose logs bintrail   # open the printed console URL
#
# What you get: an index MySQL (persisted in a volume), bintrail running
# `up --console` against your source (preflight checks → index tables →
# schema snapshot → live binlog stream), and the web console published on
# http://127.0.0.1:8090 with the access token printed in the logs.
#
# The bundled index-mysql is EVALUATION/QUICKSTART-GRADE: a single
# unreplicated volume with default credentials and no backup story —
# volume loss means re-indexing. For production, bring your own index
# MySQL (set INDEX_DSN in .env) and operate it as the system of record
# it becomes. Support boundary: SUPPORT.md.
#
# For the full interactive demo (traffic generator, Grafana, Prometheus),
# see demo/compose.yml instead.

volumes:
  index-mysql-data:
  bintrail-state:

services:

  # ── Index MySQL (evaluation/quickstart-grade) ────────────
  # Stores binlog_events, schema_snapshots, and stream_state — the
  # forensic record itself. This bundled container is for evaluation:
  # volume loss = re-index. For production, bring your own index MySQL:
  # remove this service and point INDEX_DSN in .env at yours.
  index-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${INDEX_MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: bintrail_index
    volumes:
      - index-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${INDEX_MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Bintrail: stream + web console ───────────────────────
  # `bintrail up --console` = doctor preflight + init + auto-snapshot +
  # binlog stream + the read-only web console, in one process.
  bintrail:
    image: ghcr.io/dbtrail/bintrail:${BINTRAIL_TAG:-latest}
    # Building from a source checkout instead? Comment the line above and
    # uncomment:
    # build: .
    ports:
      # Console on the host loopback only. To reach it from another machine,
      # change to "8090:8090" AND set a stable CONSOLE_TOKEN in .env.
      - "127.0.0.1:8090:8090"
    environment:
      # Your application MySQL — the server to watch (set in .env).
      SOURCE_DSN: ${SOURCE_DSN:?Set SOURCE_DSN in .env (e.g. user:pass@tcp(host.docker.internal:3306)/)}
      # The index MySQL above; swap for your own instance if you removed it.
      INDEX_DSN: ${INDEX_DSN:-root:${INDEX_MYSQL_ROOT_PASSWORD:-changeme}@tcp(index-mysql:3306)/bintrail_index}
      # Optional comma-separated schema filter (empty = all user schemas).
      SCHEMAS: ${SCHEMAS:-}
      # The console binds all interfaces INSIDE the container; the `ports`
      # mapping above is what controls actual exposure on the host.
      BINTRAIL_CONSOLE_LISTEN: 0.0.0.0:8090
      BINTRAIL_CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      # Saved console connections persist across container recreations.
      BINTRAIL_CONSOLE_SERVERS: /var/lib/bintrail/console-servers.yaml
    volumes:
      - bintrail-state:/var/lib/bintrail
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # A non-loopback console bind requires an explicit token. Generate one
        # per boot when CONSOLE_TOKEN isn't pinned in .env — the startup
        # banner below prints the full URL including it either way.
        if [ -z "$$BINTRAIL_CONSOLE_TOKEN" ]; then
          export BINTRAIL_CONSOLE_TOKEN="$$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "Generated console token (set CONSOLE_TOKEN in .env to keep it stable across restarts)"
        fi
        if [ -n "$$SCHEMAS" ]; then
          exec bintrail up --source-dsn "$$SOURCE_DSN" --index-dsn "$$INDEX_DSN" --schemas "$$SCHEMAS" --console
        fi
        exec bintrail up --source-dsn "$$SOURCE_DSN" --index-dsn "$$INDEX_DSN" --console
    depends_on:
      index-mysql:
        condition: service_healthy
    restart: unless-stopped
