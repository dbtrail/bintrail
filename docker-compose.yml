# Bintrail Docker Compose — the zero-friction quickstart.
#
#   1. docker compose up -d
#   2. Open http://127.0.0.1:8090 and create your console username + password
#   3. In the console: "+ Add server" — paste the MySQL to watch; bintrail
#      runs the preflight, provisions an index for it, and starts streaming.
#
# No .env needed. On first run the console asks you to create a username and
# password (it persists in the bintrail-state volume); every later visit is a
# normal sign-in. Forgot it? Reset from the host shell:
#   docker compose exec -it bintrail bintrail-console user set-password
# Optionally set SOURCE_DSN (start streaming one source immediately) in a .env.
# CONSOLE_TOKEN is an opt-in API-automation credential — set it only if a
# script needs the console API; humans sign in with the password.
#
# What you get: a bundled MySQL 8.4 index (persisted in a volume), the
# `bintrail-console watch` daemon against your source (preflight → index
# tables → schema snapshot → live binlog stream → built-in rotation), and the
# web console on http://127.0.0.1:8090.
#
# === THE INDEX VOLUME IS YOUR SYSTEM OF RECORD ===
# The bundled index holds the forensic record (binlog_events with full
# before/after images). Its data lives in TWO volumes that must be backed up
# and RESTORED together: `bintrail-index-data` (the MySQL datadir) and
# `bintrail-index-secret` (the password, baked into the datadir at first boot).
# Restoring a datadir paired with a mismatched secret breaks auth; changing the
# password later means resetting both. Losing only the data volume is safe — the
# surviving secret re-initializes a fresh datadir with the same password and
# bintrail re-indexes from the source's binlogs.
#
# bintrail SHIPS this MySQL but does NOT operate it: disk, backups, and upgrades
# are yours — for a managed, operated index, that is what dbtrail is. Support
# boundary: SUPPORT.md. Bring your own instead: set INDEX_DSN in .env (see
# docs/docker.md).
#
# For the full interactive demo (traffic generator, Grafana, Prometheus),
# see demo/compose.yml instead.

volumes:
  bintrail-index-data:    # MySQL 8.4 datadir — the forensic record (NEW volume:
                          # never reuse the old 8.0 `index-mysql-data`, an 8.4
                          # server auto-upgrades an 8.0 datadir irreversibly).
  bintrail-index-secret:  # the generated index password (shares fate with the
                          # datadir — back up / reset the two together).
  bintrail-state:         # bintrail runtime state (saved console servers, …).

services:

  # ── Index password (one-shot) ────────────────────────────
  # Generates a random index MySQL password on first boot (or takes one
  # from INDEX_MYSQL_ROOT_PASSWORD in .env if you set it BEFORE the first
  # `up` — changing it later means resetting the index volumes). Both the
  # index MySQL and bintrail read it from the secret volume, so there is no
  # static default password on a volume holding the forensic record.
  index-init:
    # Reuses the console image (already pulled for the main service below) —
    # this step only needs a shell + od to seed the password file.
    image: ghcr.io/dbtrail/bintrail-console:${BINTRAIL_TAG:-latest}
    # Building from a source checkout instead? Uncomment here AND on the
    # bintrail service below (keep the image: lines — `docker compose build`
    # tags the local build with that name, so nothing is pulled):
    # build:
    #   context: .
    #   dockerfile: Dockerfile.bintrail-console
    # Runs as root: a freshly-created named volume is root-owned, and the
    # bintrail image otherwise runs as a non-root user that couldn't write it.
    # The secret is then chowned to uid 999 mode 0600 FOR the bintrail process
    # (uid 999), the only non-root reader. The index-mysql side reads it as
    # root — the entrypoint reads MYSQL_ROOT_PASSWORD_FILE before dropping to
    # the mysql user, and the healthcheck runs as root — both bypass the mode.
    # Not world-readable.
    user: "0:0"
    environment:
      INDEX_MYSQL_ROOT_PASSWORD: ${INDEX_MYSQL_ROOT_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        f=/secret/index_password
        if [ -s "$$f" ]; then exit 0; fi   # already seeded; password is fixed at datadir init
        if [ -n "$$INDEX_MYSQL_ROOT_PASSWORD" ]; then
          printf '%s' "$$INDEX_MYSQL_ROOT_PASSWORD" > "$$f"
          echo "Index MySQL password taken from INDEX_MYSQL_ROOT_PASSWORD."
        else
          od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > "$$f"
          echo "Generated a random index MySQL password (stored in the bintrail-index-secret volume)."
        fi
        # dash has no pipefail and `set -e` only checks the last pipe stage, so a
        # failed od/urandom would leave an EMPTY file. Refuse a blank password
        # rather than let MySQL refuse to initialize with a confusing error.
        if [ ! -s "$$f" ]; then echo "FATAL: failed to write the index password" >&2; rm -f "$$f"; exit 1; fi
        chown 999:999 "$$f"
        chmod 0600 "$$f"
    volumes:
      - bintrail-index-secret:/secret

  # ── Index MySQL 8.4 (the forensic record) ────────────────
  # Stores binlog_events, schema_snapshots, and stream_state. Pinned to an
  # exact 8.4 LTS minor — bump it deliberately (swap the container; the
  # datadir volume persists, PMM-style). Bring your own instead: set
  # INDEX_DSN in .env and remove this service, index-init, and the
  # bintrail-index-secret mount on `bintrail` (see docs/docker.md).
  index-mysql:
    image: mysql:8.4.9
    # --innodb-flush-log-at-trx-commit=2 is the one safe index-side tuning
    # (bintrail replays from the stream_state checkpoint, so a ≤1s recovery
    # window is acceptable). buffer-pool size is left at the default — it
    # depends on host RAM and is the operator's to tune (docs/deployment.md §3).
    command: ["--innodb-flush-log-at-trx-commit=2"]
    environment:
      # 8.4 defaults to caching_sha2_password (native_password disabled);
      # bintrail's driver negotiates it over the plaintext Docker network.
      MYSQL_ROOT_PASSWORD_FILE: /run/secret/index_password
      MYSQL_DATABASE: bintrail_index
    volumes:
      - bintrail-index-data:/var/lib/mysql
      - bintrail-index-secret:/run/secret:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$(cat /run/secret/index_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      index-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Bintrail: stream + web console ───────────────────────
  # `bintrail-console watch` = doctor preflight + init + auto-snapshot +
  # binlog stream + built-in rotation + the read-only web console (the
  # daemon formerly known as `bintrail up --console`).
  bintrail:
    image: ghcr.io/dbtrail/bintrail-console:${BINTRAIL_TAG:-latest}
    # Building from a source checkout instead? Uncomment here AND on
    # index-init above (keep the image: lines — `docker compose build` tags
    # the local build with that name, so nothing is pulled):
    # build:
    #   context: .
    #   dockerfile: Dockerfile.bintrail-console
    ports:
      # Console on the host loopback only — first-run password setup is allowed
      # because reaching loopback already implies local access. To reach it from
      # another machine, first create the password from the host shell
      # (docker compose exec -it bintrail bintrail-console user set-password —
      # off-loopback setup is refused), THEN change to "8090:8090", ideally
      # behind TLS or a TLS-terminating proxy.
      - "127.0.0.1:8090:8090"
    environment:
      # Optional: a source MySQL to start watching immediately. Leave unset
      # and add servers from the console UI instead (the zero-config path).
      SOURCE_DSN: ${SOURCE_DSN:-}
      # Bring your own index: set INDEX_DSN in .env to override the bundled
      # MySQL entirely. Empty = use the bundled index (DSN built from the
      # generated password below).
      INDEX_DSN: ${INDEX_DSN:-}
      # Optional comma-separated schema filter (empty = all user schemas).
      SCHEMAS: ${SCHEMAS:-}
      # The console binds all interfaces INSIDE the container; the `ports`
      # mapping above is what controls actual exposure on the host.
      BINTRAIL_CONSOLE_LISTEN: 0.0.0.0:8090
      BINTRAIL_CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      # Saved console connections persist across container recreations.
      BINTRAIL_CONSOLE_SERVERS: /var/lib/bintrail/console-servers.yaml
      # Password login (persists next to the registry). On first run the
      # console serves a "create your password" screen; later visits sign in.
      # There is deliberately NO password env var: docker inspect must never
      # be able to print a credential.
      BINTRAIL_CONSOLE_AUTH: /var/lib/bintrail/console-auth.yaml
      # The console binds 0.0.0.0 INSIDE the container, but the `ports` mapping
      # above publishes it on the host's loopback only — so first-run setup is
      # access-controlled in the default stack. The container can't see the
      # host mapping, so we assert it here. If you change `ports` to expose the
      # console (e.g. "8090:8090"), set the password from the host shell FIRST
      # (docker compose exec … user set-password) before exposing it.
      BINTRAIL_CONSOLE_ALLOW_SETUP: "1"
    volumes:
      - bintrail-state:/var/lib/bintrail
      - bintrail-index-secret:/run/secret:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Use the bundled index unless the operator brought their own. The
        # generated password lives in the secret volume; build the DSN from it.
        # NOTE: plain assignment on purpose — under `set -e` it propagates a
        # failed `cat` (unreadable secret) and aborts loud; `export`/`local`
        # would mask the substitution's exit status and build an empty password.
        if [ -z "$$INDEX_DSN" ]; then
          INDEX_DSN="root:$$(cat /run/secret/index_password)@tcp(index-mysql:3306)/bintrail_index"
        fi
        # No token is generated: the console binds to loopback, so first run is
        # password SETUP — open the printed URL and create your console
        # username and password (it persists in the bintrail-state volume next
        # to the server registry). CONSOLE_TOKEN in .env is an opt-in API
        # automation credential, passed through via the environment above; it
        # is not generated for you.
        if [ -n "$$SOURCE_DSN" ] && [ -n "$$SCHEMAS" ]; then
          exec bintrail-console watch --source-dsn "$$SOURCE_DSN" --index-dsn "$$INDEX_DSN" --schemas "$$SCHEMAS"
        elif [ -n "$$SOURCE_DSN" ]; then
          exec bintrail-console watch --source-dsn "$$SOURCE_DSN" --index-dsn "$$INDEX_DSN"
        fi
        exec bintrail-console watch --index-dsn "$$INDEX_DSN"
    depends_on:
      index-mysql:
        condition: service_healthy
    restart: unless-stopped
